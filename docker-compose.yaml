services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fml-devpilot-postgres
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - fml_devpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fml_devpilot_pg_data:
