server:
  port:
    8080

  servlet:
    session:
      cookie:
        name: DEVPILOT_SESSION
        http-only: true
        same-site: lax

      timeout: 7d

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    # Closes DB connection by fetching everything all at once, FetchType.LAZY keeps the connection open, this doesn't let that happen
    open-in-view: false

  # Flyway is a DB migration tool
  flyway:
    enabled: true
    locations: classpath:/db/migration
    # If the tables are generated beforehand and flyway isn't tracking them, flyway won't look for flyway_schema_history, it will generate new history
    baseline-on-migrate: true

  ai:
    # OpenAi
    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        model: gpt-4o-mini

      embedding:
        model: text-embedding-3-small

  # PgVector
  vectorstore:
    pgvector:
      initialize: true
      dimensions: 1536
      index-type: HNSW
      distance-type: COSINE_DISTANCE

  # Github OAuth2 config
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,repo

        provider:
          github:
            user-name-attribute: id
app:
  frontend-url: ${FRONTEND_URL}

  cors:
    allowed-origins: ${FRONTEND_URL}

  # Text encrypter
  encryption:
    password: ${ENCRYPTION_PASSWORD}
    salt: ${ENCRYPTION_SALT}

  # RAG indexing
  indexing:
    max-file-bytes: 102400
    chunk-size: 800
    chunk-overlap: 100
    api-delay-ms: 50

  api:
    github-api-base: ${GITHUB_API_BASE}